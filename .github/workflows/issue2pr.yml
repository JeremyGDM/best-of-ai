name: Review Tool Submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Only run on tool submission issues
    if: |
      contains(github.event.issue.title, 'Submit Tool') ||
      contains(github.event.issue.title, 'submit tool') ||
      contains(github.event.issue.title, 'Add Tool') ||
      contains(github.event.issue.title, 'add tool')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Run issue reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: python scripts/issue-review.py